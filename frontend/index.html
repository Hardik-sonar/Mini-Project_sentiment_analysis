<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sentiment Analyzer</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="container">
        <h1>Sentiment Analyzer</h1>
        <p class="sub">Powered by Azure · AWS · GCP</p>

        <textarea id="textInput" rows="6" maxlength="1000" placeholder="Type or paste text to analyze..."></textarea>
        <div class="counter"><span id="charCount">0</span> / 1000</div>

        <button id="analyzeBtn">Analyze</button>
        <div id="loader" class="hidden">Analyzing...</div>
        <div id="error" class="error hidden"></div>

        <section id="result" class="card hidden">
            <span id="badge" class="badge"></span>
            <p>Score: <strong id="score"></strong></p>
            <p>Magnitude: <strong id="magnitude"></strong></p>
            <p class="time">Analyzed at: <span id="timestamp"></span></p>
        </section>
    </main>
    <script src="config.js"></script>
    <script src="script.js"></script>
</body>

</html>
