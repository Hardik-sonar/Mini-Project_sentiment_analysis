<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 770" width="1200" height="770" font-family="'Segoe UI', Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>SocialPulse multi-cloud architecture</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="1200" height="770" fill="#ffffff"/>

  <text x="40" y="36" font-size="22" font-weight="700" fill="#111827">SocialPulse: multi-cloud architecture</text>
  <text x="40" y="56" font-size="13" fill="#6b7280">YouTube comment sentiment analyzer (Azure + AWS + Cloudflare)</text>

  <!-- AWS group -->
  <rect x="290" y="70" width="445" height="520" rx="12" fill="#fafafa" stroke="#232f3e" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="310" y="97" font-size="14" font-weight="700" fill="#232f3e">AWS Cloud</text>
  <text x="310" y="124" font-size="11" fill="#4b5563">API keys live in Lambda environment variables (never in the frontend).</text>

  <!-- Azure -->
  <rect x="40" y="100" width="170" height="90" rx="10" fill="#e6f2fb" stroke="#0078d4" stroke-width="2"/>
  <text x="125" y="130" font-size="14" font-weight="700" fill="#004e8c" text-anchor="middle">Azure App Service</text>
  <text x="125" y="150" font-size="11" fill="#1f2937" text-anchor="middle">Flask serves static site</text>
  <text x="125" y="166" font-size="11" fill="#1f2937" text-anchor="middle">HTML / CSS / JS</text>

  <!-- Browser -->
  <rect x="40" y="270" width="170" height="100" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="125" y="302" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">User's browser</text>
  <text x="125" y="324" font-size="11" fill="#1f2937" text-anchor="middle">Paste URL, view dashboard</text>
  <text x="125" y="340" font-size="11" fill="#1f2937" text-anchor="middle">Chart.js doughnut + table</text>

  <!-- API Gateway -->
  <rect x="310" y="270" width="140" height="100" rx="10" fill="#fff4e0" stroke="#d98300" stroke-width="2"/>
  <text x="380" y="302" font-size="14" font-weight="700" fill="#7a4600" text-anchor="middle">API Gateway</text>
  <text x="380" y="324" font-size="11" fill="#1f2937" text-anchor="middle">HTTP API</text>
  <text x="380" y="340" font-size="11" fill="#1f2937" text-anchor="middle">POST /analyze-video</text>
  <text x="380" y="356" font-size="11" fill="#1f2937" text-anchor="middle">CORS enabled</text>

  <!-- Lambda -->
  <rect x="530" y="270" width="180" height="100" rx="10" fill="#fff4e0" stroke="#d98300" stroke-width="2"/>
  <text x="620" y="302" font-size="14" font-weight="700" fill="#7a4600" text-anchor="middle">AWS Lambda</text>
  <text x="620" y="324" font-size="11" fill="#1f2937" text-anchor="middle">Python 3.12 orchestrator</text>
  <text x="620" y="340" font-size="11" fill="#1f2937" text-anchor="middle">validate, fetch, analyze</text>
  <text x="620" y="356" font-size="11" fill="#1f2937" text-anchor="middle">in parallel, aggregate</text>

  <!-- S3 -->
  <rect x="530" y="470" width="180" height="100" rx="10" fill="#fff4e0" stroke="#d98300" stroke-width="2"/>
  <text x="620" y="502" font-size="14" font-weight="700" fill="#7a4600" text-anchor="middle">Amazon S3</text>
  <text x="620" y="524" font-size="11" fill="#1f2937" text-anchor="middle">Private, encrypted bucket</text>
  <text x="620" y="540" font-size="11" fill="#1f2937" text-anchor="middle">analyses/YYYY/MM/DD/</text>
  <text x="620" y="556" font-size="11" fill="#1f2937" text-anchor="middle">(run id).json</text>

  <!-- IAM note -->
  <rect x="310" y="490" width="195" height="60" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-dasharray="4 3"/>
  <text x="407" y="514" font-size="11" font-weight="700" fill="#374151" text-anchor="middle">IAM role (least privilege)</text>
  <text x="407" y="532" font-size="11" fill="#374151" text-anchor="middle">s3:PutObject on analyses/*</text>

  <!-- YouTube -->
  <rect x="880" y="120" width="280" height="100" rx="10" fill="#fdecec" stroke="#d32f2f" stroke-width="2"/>
  <text x="1020" y="152" font-size="14" font-weight="700" fill="#8e1b1b" text-anchor="middle">YouTube Data API v3</text>
  <text x="1020" y="174" font-size="11" fill="#1f2937" text-anchor="middle">commentThreads.list</text>
  <text x="1020" y="190" font-size="11" fill="#1f2937" text-anchor="middle">Top-level comments, up to 200</text>

  <!-- Cloudflare -->
  <rect x="880" y="270" width="280" height="100" rx="10" fill="#fef0e4" stroke="#f6821f" stroke-width="2"/>
  <text x="1020" y="302" font-size="14" font-weight="700" fill="#9a4a05" text-anchor="middle">Cloudflare Workers AI</text>
  <text x="1020" y="324" font-size="11" fill="#1f2937" text-anchor="middle">@cf/meta/llama-3.1-8b-instruct</text>
  <text x="1020" y="340" font-size="11" fill="#1f2937" text-anchor="middle">One call per comment:</text>
  <text x="1020" y="356" font-size="11" fill="#1f2937" text-anchor="middle">Positive / Negative / Neutral</text>

  <!-- Arrows -->
  <line x1="125" y1="190" x2="125" y2="268" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="210" y1="305" x2="308" y2="305" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="308" y1="345" x2="212" y2="345" stroke="#374151" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah)"/>
  <line x1="450" y1="320" x2="528" y2="320" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M710 300 H770 V170 H878" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="710" y1="320" x2="878" y2="320" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="620" y1="370" x2="620" y2="468" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <!-- Step badges -->
  <g fill="#1f2937"><circle cx="125" cy="230" r="11"/><circle cx="259" cy="305" r="11"/><circle cx="259" cy="345" r="11"/>
    <circle cx="489" cy="320" r="11"/><circle cx="770" cy="235" r="11"/><circle cx="800" cy="320" r="11"/><circle cx="620" cy="420" r="11"/></g>
  <g fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">
    <text x="125" y="234">1</text><text x="259" y="309">2</text><text x="259" y="349">7</text>
    <text x="489" y="324">3</text><text x="770" y="239">4</text><text x="800" y="324">5</text><text x="620" y="424">6</text></g>

  <!-- Legend -->
  <text x="40" y="632" font-size="15" font-weight="700" fill="#111827">Request flow</text>
  <g fill="#1f2937"><circle cx="52" cy="654" r="9"/><circle cx="52" cy="680" r="9"/><circle cx="52" cy="706" r="9"/><circle cx="52" cy="732" r="9"/>
    <circle cx="632" cy="654" r="9"/><circle cx="632" cy="680" r="9"/><circle cx="632" cy="706" r="9"/></g>
  <g fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">
    <text x="52" y="658">1</text><text x="52" y="684">2</text><text x="52" y="710">3</text><text x="52" y="736">4</text>
    <text x="632" y="658">5</text><text x="632" y="684">6</text><text x="632" y="710">7</text></g>
  <g font-size="13" fill="#1f2937">
    <text x="72" y="659">Browser loads the static dashboard from Azure App Service.</text>
    <text x="72" y="685">User submits a YouTube URL: POST /analyze-video over HTTPS.</text>
    <text x="72" y="711">API Gateway (CORS: Azure origin only) invokes Lambda.</text>
    <text x="72" y="737">Lambda validates the URL and fetches up to 200 comments.</text>
    <text x="652" y="659">Lambda labels each comment in parallel via Workers AI.</text>
    <text x="652" y="685">Lambda saves the full run as JSON in a private S3 bucket.</text>
    <text x="652" y="711">Results return (dashed arrow); Chart.js draws the dashboard.</text>
  </g>
</svg>
